# DOCUMENTATION ONLY — DO NOT APPLY THIS FILE DIRECTLY
# Real secret values are injected by the CI pipeline via GitHub Actions secrets.
# See .github/workflows/deploy-production.yml → "Inject application secrets into cluster"
# To bootstrap a fresh cluster manually, see the Initial Setup section in the plan docs.
apiVersion: v1
kind: Secret
metadata:
  name: synkora-secrets
  namespace: synkora-production
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME"
  JWT_SECRET_KEY: "CHANGE_ME"
  ENCRYPTION_KEY: "CHANGE_ME"
  JWT_ACCESS_TOKEN_EXPIRES: "CHANGE_ME"
  JWT_REFRESH_TOKEN_EXPIRES: "CHANGE_ME"
  JWT_ALGORITHM: "CHANGE_ME"
  # DB_PORT is non-sensitive; set in synkora-config.yml (ConfigMap), not here.
  # DB_HOST is sensitive (reveals internal topology) so kept in secrets.
  DB_HOST: "CHANGE_ME"
  DB_USERNAME: "CHANGE_ME"
  DB_DATABASE: "CHANGE_ME"
  DB_CHARSET: ""
  DB_EXTRAS: ""
  DB_PASSWORD: "CHANGE_ME"
  SQLALCHEMY_DATABASE_URI_SCHEME: "CHANGE_ME"
  SQLALCHEMY_POOL_SIZE: "CHANGE_ME"
  SQLALCHEMY_MAX_OVERFLOW: "CHANGE_ME"
  SQLALCHEMY_POOL_RECYCLE: "CHANGE_ME"
  SQLALCHEMY_POOL_USE_LIFO: "CHANGE_ME"
  SQLALCHEMY_POOL_PRE_PING: "CHANGE_ME"
  SQLALCHEMY_ECHO: "CHANGE_ME"
  SQLALCHEMY_POOL_TIMEOUT: "CHANGE_ME"
  # Redis — AWS ElastiCache. Use rediss:// (TLS) with auth token if encryption-in-transit is enabled.
  # Format: rediss://:<auth_token>@<cluster>.cache.amazonaws.com:6379/0
  REDIS_URL: "CHANGE_ME"
  REDIS_MAX_CONNECTIONS: "CHANGE_ME"
  CELERY_BROKER_URL: "CHANGE_ME"
  CELERY_RESULT_BACKEND: "CHANGE_ME"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  PINECONE_API_KEY: "CHANGE_ME"
  LANGFUSE_HOST: "CHANGE_ME"
  LANGFUSE_PUBLIC_KEY: "CHANGE_ME"
  LANGFUSE_SECRET_KEY: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  OPENAI_API_KEY: "CHANGE_ME"
  ANTHROPIC_API_KEY: "CHANGE_ME"
  SENTRY_DSN: "CHANGE_ME"
  SENTRY_ENVIRONMENT: "production"
  METRICS_AUTH_TOKEN: "CHANGE_ME"
  ML_SERVICE_URL: "http://synkora-ml:5002"
  SCRAPER_SERVICE_URL: "http://synkora-scraper:5003"
  SCRAPER_API_KEY: "CHANGE_ME"
  SANDBOX_SERVICE_URL: "http://synkora-sandbox:5004"
  SANDBOX_API_KEY: "CHANGE_ME"
  # Audit log HMAC chain — REQUIRED in production. Generate: openssl rand -hex 32
  AUDIT_CHAIN_SECRET: "CHANGE_ME"
  # SIEM webhook signing secret — optional, enables X-SIEM-Signature header
  SIEM_WEBHOOK_SECRET: ""
  # SIEM webhook destination — optional, streams every audit event as a JSON POST
  SIEM_WEBHOOK_URL: ""
  # Elasticsearch credentials — must match ELASTIC_PASSWORD/username set when ES was initialized
  ELASTICSEARCH_USERNAME: "elastic"
  ELASTICSEARCH_PASSWORD: "CHANGE_ME"

