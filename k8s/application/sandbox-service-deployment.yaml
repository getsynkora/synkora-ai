---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synkora-sandbox
  namespace: synkora-production
  labels:
    app: synkora
    component: sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: synkora
      component: sandbox
  template:
    metadata:
      labels:
        app: synkora
        component: sandbox
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: sandbox
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            # The nodes' Debian kernel disables unprivileged user-namespace
            # creation by default (kernel.unprivileged_userns_clone=0).
            # bwrap --unshare-user (isolation.py) needs CAP_SYS_ADMIN to
            # bypass that restriction. This only affects the outer sandbox
            # container itself — bwrap still runs the untrusted code with
            # --unshare-all --cap-drop ALL, so the code being sandboxed has
            # no more privilege than before.
            add: ["SYS_ADMIN"]
          # CAP_SYS_ADMIN alone was not sufficient: the node's AppArmor
          # policy independently denies unshare(CLONE_NEWUSER) regardless of
          # capabilities unless the container's own profile allows it.
          # Unconfine just this container's AppArmor mediation; the pod's
          # Linux capabilities/UID restrictions above are unaffected, and
          # bwrap's internal isolation of the executed code is unaffected.
          appArmorProfile:
            type: Unconfined
        image: SANDBOX_IMAGE_PLACEHOLDER
        imagePullPolicy: Always
        ports:
        - containerPort: 5004
          name: http
          protocol: TCP
        env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: synkora-config
              key: APP_ENV
        - name: SANDBOX_MAX_CONCURRENT_EXEC
          value: "4"
        - name: SANDBOX_MAX_EXEC_TIMEOUT
          value: "300"
        - name: SANDBOX_API_KEY
          valueFrom:
            secretKeyRef:
              name: synkora-secrets
              key: SANDBOX_API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5004
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5004
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: workspaces
          mountPath: /workspaces
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: workspaces
        emptyDir:
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: synkora-sandbox
  namespace: synkora-production
  labels:
    app: synkora
    component: sandbox
spec:
  type: ClusterIP
  selector:
    app: synkora
    component: sandbox
  ports:
  - name: http
    port: 5004
    targetPort: 5004
    protocol: TCP
