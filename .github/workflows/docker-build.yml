name: Docker Build Test

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          tags: synkora-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build Web Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/Dockerfile
          push: false
          tags: synkora-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000

  build-ml:
    name: Build ML Service Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ML service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ml
          file: ./services/ml/Dockerfile
          push: false
          tags: synkora-ml:test
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml
          # Pinned HuggingFace model revisions (supply-chain: build fails an
          # unpinned image rather than trusting an upstream model update at
          # build time). Bump deliberately in both this workflow and
          # deploy-production.yml after reviewing the new revision.
          build-args: |
            EMBEDDING_MODEL_REVISION=1110a243fdf4706b3f48f1d95db1a4f5529b4d41
            RERANK_MODEL_REVISION=233902d25c440f23af6f7d6e94d2946bac0bee0a

  build-scraper:
    name: Build Scraper Service Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build scraper service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/scraper
          file: ./services/scraper/Dockerfile
          push: false
          tags: synkora-scraper:test
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,mode=max,scope=scraper

  build-sandbox:
    name: Build Sandbox Service Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sandbox service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/sandbox
          file: ./services/sandbox/Dockerfile
          push: false
          tags: synkora-sandbox:test
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox