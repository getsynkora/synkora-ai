<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="180" y1="80" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#F4ECDD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#171717" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11V1Z" fill="#FF5F8F"/>
    </marker>
    <style>
      .title { font: 700 44px Arial, sans-serif; fill: #171717; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #5B564E; }
      .band { fill: #FFFFFF; fill-opacity: 0.82; stroke: #171717; stroke-opacity: 0.08; stroke-width: 2; }
      .bandLabel { font: 700 16px Arial, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; fill: #7A736A; }
      .card { fill: #FFF9EF; stroke: #171717; stroke-opacity: 0.08; stroke-width: 2; }
      .cardDark { fill: #171717; }
      .cardMint { fill: #79DFBC; fill-opacity: 0.22; stroke: #171717; stroke-opacity: 0.08; stroke-width: 2; }
      .cardWhite { fill: #FFFFFF; fill-opacity: 0.92; stroke: #171717; stroke-opacity: 0.08; stroke-width: 2; }
      .cardTitle { font: 700 26px Arial, sans-serif; fill: #171717; }
      .cardTitleDark { font: 700 26px Arial, sans-serif; fill: #F7F2E7; }
      .cardText { font: 400 18px Arial, sans-serif; fill: #5B564E; }
      .cardTextDark { font: 400 18px Arial, sans-serif; fill: #D8D0C4; }
      .smallLabel { font: 700 14px Arial, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; fill: #7A736A; }
      .pill { fill: #EDF8F3; stroke: #D7EADF; stroke-width: 1.5; }
      .pillText { font: 700 14px Arial, sans-serif; fill: #2D8B69; }
      .line { stroke: #FF5F8F; stroke-width: 6; stroke-linecap: round; marker-end: url(#arrow); }
      .lineMint { stroke: #79DFBC; stroke-width: 6; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" rx="40" fill="url(#bg)"/>
  <circle cx="1370" cy="126" r="170" fill="#FFF8ED"/>
  <circle cx="178" cy="856" r="144" fill="#EEE4CF"/>

  <text x="120" y="104" class="bandLabel">Synkora Architecture</text>
  <text x="120" y="166" class="title">High-Level System Design</text>
  <text x="120" y="208" class="subtitle">One control plane for agent creation, runtime orchestration, async execution, retrieval, and delivery across channels.</text>

  <rect x="100" y="250" width="1400" height="150" rx="34" class="band" filter="url(#shadow)"/>
  <text x="132" y="292" class="bandLabel">Experience Layer</text>

  <rect x="132" y="314" width="300" height="58" rx="20" class="pill"/>
  <text x="160" y="351" class="pillText">Dashboard + Docs + Blog + Public site</text>
  <rect x="468" y="314" width="240" height="58" rx="20" class="pill"/>
  <text x="504" y="351" class="pillText">Widget + REST API</text>
  <rect x="744" y="314" width="282" height="58" rx="20" class="pill"/>
  <text x="778" y="351" class="pillText">Slack + Telegram + Messaging</text>
  <rect x="1062" y="314" width="406" height="58" rx="20" class="pill"/>
  <text x="1096" y="351" class="pillText">Public agents + landing pages + extension surfaces</text>

  <rect x="100" y="438" width="1400" height="228" rx="34" class="band" filter="url(#shadow)"/>
  <text x="132" y="480" class="bandLabel">Application and Execution Layers</text>

  <rect x="132" y="512" width="430" height="122" rx="30" class="cardDark"/>
  <text x="166" y="556" class="cardTitleDark">Next.js Application</text>
  <text x="166" y="592" class="cardTextDark">Single app in `web/` serving the dashboard, docs, blog, pricing,</text>
  <text x="166" y="620" class="cardTextDark">public pages, and authenticated product surfaces.</text>

  <rect x="602" y="512" width="430" height="122" rx="30" class="card"/>
  <text x="636" y="556" class="cardTitle">FastAPI Runtime</text>
  <text x="636" y="592" class="cardText">Tenant-aware APIs, auth, chat flows, public routes,</text>
  <text x="636" y="620" class="cardText">service APIs, and WebSocket-backed realtime delivery.</text>

  <rect x="1072" y="498" width="396" height="68" rx="24" class="cardWhite"/>
  <text x="1104" y="542" class="cardTitle">Redis Coordination</text>
  <rect x="1072" y="582" width="396" height="68" rx="24" class="cardMint"/>
  <text x="1104" y="626" class="cardTitle">Celery + Beat + Bot Worker</text>

  <path d="M564 573H596" class="line"/>
  <path d="M1034 546H1066" class="line"/>
  <path d="M1034 616H1066" class="lineMint"/>

  <rect x="100" y="706" width="1400" height="186" rx="34" class="band" filter="url(#shadow)"/>
  <text x="132" y="748" class="bandLabel">Data and Support Services</text>

  <rect x="132" y="782" width="290" height="80" rx="28" class="cardWhite"/>
  <text x="166" y="822" class="cardTitle">PostgreSQL + pgvector</text>
  <text x="166" y="848" class="cardText">tenants, agents, conversations, billing, relational truth</text>

  <rect x="454" y="782" width="314" height="80" rx="28" class="cardWhite"/>
  <text x="488" y="822" class="cardTitle">Qdrant / Pinecone / Elasticsearch</text>
  <text x="488" y="848" class="cardText">retrieval, vector search, search workloads, Lens support</text>

  <rect x="800" y="782" width="252" height="80" rx="28" class="cardWhite"/>
  <text x="834" y="822" class="cardTitle">MinIO / S3</text>
  <text x="834" y="848" class="cardText">uploaded files, assets, document storage</text>

  <rect x="1084" y="768" width="384" height="94" rx="28" class="cardWhite"/>
  <text x="1118" y="810" class="cardTitle">Langfuse + ML + Scraper Services</text>
  <text x="1118" y="836" class="cardText">observability, embeddings, reranking, browser automation</text>

  <path d="M286 662V774" class="lineMint"/>
  <path d="M612 662V774" class="lineMint"/>
  <path d="M926 662V774" class="lineMint"/>
  <path d="M1268 662V760" class="lineMint"/>
</svg>
