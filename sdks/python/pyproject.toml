[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synkora"
version = "0.1.0"
description = "Python SDK for the Synkora AI agent platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Synkora", email = "support@synkora.com" }]
keywords = ["ai", "agents", "llm", "synkora", "chatbot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://synkora.com"
Repository = "https://github.com/getsynkora/synkora-ai"
Documentation = "https://docs.synkora.com"
"Bug Tracker" = "https://github.com/getsynkora/synkora-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["synkora"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "mypy>=1.11",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
