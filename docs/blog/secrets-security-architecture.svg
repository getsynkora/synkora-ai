<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="encGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="runtimeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="piiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" fill="#e5e5e5" font-size="15" font-weight="600" letter-spacing="0.5">Synkora Secret Security Architecture</text>
  <text x="480" y="56" text-anchor="middle" fill="#666" font-size="11">Encryption at rest · Runtime context isolation · 6-layer output firewall</text>

  <!-- ═══════════════════════════════════ LAYER 1: STORAGE ═══════════ -->
  <!-- Encrypted Storage Box -->
  <rect x="30" y="80" width="200" height="200" rx="8" fill="url(#encGrad)" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="130" y="101" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="700" letter-spacing="1">FERNET ENCRYPTED AT REST</text>

  <!-- Storage items -->
  <rect x="48" y="112" width="164" height="26" rx="4" fill="#1e1e2e" stroke="#374151"/>
  <text x="82" y="130" fill="#a78bfa" font-size="10">OAuth tokens</text>
  <text x="192" y="130" text-anchor="end" fill="#4b5563" font-size="9" font-style="italic">user_oauth_tokens</text>

  <rect x="48" y="146" width="164" height="26" rx="4" fill="#1e1e2e" stroke="#374151"/>
  <text x="82" y="164" fill="#a78bfa" font-size="10">DB credentials</text>
  <text x="192" y="164" text-anchor="end" fill="#4b5563" font-size="9" font-style="italic">database_connections</text>

  <rect x="48" y="180" width="164" height="26" rx="4" fill="#1e1e2e" stroke="#374151"/>
  <text x="82" y="198" fill="#a78bfa" font-size="10">API keys</text>
  <text x="192" y="198" text-anchor="end" fill="#4b5563" font-size="9" font-style="italic">integration_configs</text>

  <rect x="48" y="214" width="164" height="26" rx="4" fill="#1e1e2e" stroke="#374151"/>
  <text x="82" y="232" fill="#a78bfa" font-size="10">SSH keys / credentials</text>
  <text x="192" y="232" text-anchor="end" fill="#4b5563" font-size="9" font-style="italic">agent_compute</text>

  <!-- Key rotation label -->
  <rect x="48" y="248" width="164" height="20" rx="4" fill="#1a1a2e" stroke="#6366f1" stroke-width="0.5"/>
  <text x="130" y="262" text-anchor="middle" fill="#6366f1" font-size="9">MultiFernet · key rotation zero-downtime</text>

  <!-- ═══════════════════════════════════ LAYER 2: RUNTIME CONTEXT ═══ -->
  <rect x="270" y="80" width="220" height="200" rx="8" fill="url(#runtimeGrad)" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="101" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700" letter-spacing="1">RUNTIME CONTEXT ISOLATION</text>

  <!-- CredentialResolver box -->
  <rect x="288" y="112" width="184" height="56" rx="4" fill="#0f2820" stroke="#10b981" stroke-width="1"/>
  <text x="380" y="131" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">CredentialResolver</text>
  <text x="298" y="148" fill="#6ee7b7" font-size="9">· Never returns raw credentials</text>
  <text x="298" y="161" fill="#6ee7b7" font-size="9">· Returns authenticated clients</text>

  <!-- RuntimeContext box -->
  <rect x="288" y="178" width="184" height="44" rx="4" fill="#0f2820" stroke="#10b981" stroke-width="1"/>
  <text x="380" y="196" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">RuntimeContext</text>
  <text x="298" y="213" fill="#6ee7b7" font-size="9">tenant_id · agent_id · db_session</text>

  <!-- Lazy decryption note -->
  <rect x="288" y="232" width="184" height="36" rx="4" fill="#1a2820" stroke="#10b981" stroke-width="0.5"/>
  <text x="380" y="248" text-anchor="middle" fill="#10b981" font-size="9">Decrypt only when needed</text>
  <text x="380" y="261" text-anchor="middle" fill="#10b981" font-size="9">One-time per request · no cross-request cache</text>

  <!-- ═══════════════════════════════════ LAYER 3: PII REDACTOR ════════ -->
  <rect x="530" y="80" width="220" height="200" rx="8" fill="url(#piiGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="101" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700" letter-spacing="1">PII REDACTOR (TOOL RESULTS)</text>

  <!-- Mode 1 -->
  <rect x="548" y="112" width="184" height="52" rx="4" fill="#1f1500" stroke="#f59e0b" stroke-width="1"/>
  <text x="640" y="130" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">redact_for_llm</text>
  <text x="558" y="146" fill="#fde68a" font-size="9">tool result: alice@corp.com</text>
  <text x="558" y="159" fill="#fde68a" font-size="9">to LLM:  [EMAIL_1]  (token)</text>

  <!-- Mode 2 -->
  <rect x="548" y="173" width="184" height="52" rx="4" fill="#1f1500" stroke="#f59e0b" stroke-width="1"/>
  <text x="640" y="191" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">redact_for_response</text>
  <text x="558" y="207" fill="#fde68a" font-size="9">user sees:   [EMAIL_1]</text>
  <text x="558" y="220" fill="#fde68a" font-size="9">PII never reaches the end user</text>

  <!-- Streaming buffer -->
  <rect x="548" y="234" width="184" height="34" rx="4" fill="#1a1200" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="640" y="249" text-anchor="middle" fill="#f59e0b" font-size="9">SSE streaming buffer</text>
  <text x="640" y="262" text-anchor="middle" fill="#f59e0b" font-size="9">holds partial tokens at chunk boundaries</text>

  <!-- ═══════════════════════════════════ LAYER 4: OUTPUT SANITIZER ══ -->
  <rect x="30" y="310" width="710" height="200" rx="8" fill="url(#outputGrad)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="385" y="331" text-anchor="middle" fill="#f87171" font-size="10" font-weight="700" letter-spacing="1">6-LAYER OUTPUT SANITIZER — EVERY LLM RESPONSE PASSES THROUGH THIS</text>

  <!-- 6 layer boxes -->
  <!-- Layer 1 -->
  <rect x="50" y="342" width="96" height="74" rx="4" fill="#2a0a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="98" y="360" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">LAYER 1</text>
  <text x="98" y="374" text-anchor="middle" fill="#fca5a5" font-size="8.5">Credentials</text>
  <text x="98" y="387" text-anchor="middle" fill="#9ca3af" font-size="7.5">sk-... OpenAI</text>
  <text x="98" y="398" text-anchor="middle" fill="#9ca3af" font-size="7.5">sk-ant-... Claude</text>
  <text x="98" y="409" text-anchor="middle" fill="#9ca3af" font-size="7.5">AKIA... AWS · ghp_...</text>

  <!-- Layer 2 -->
  <rect x="156" y="342" width="96" height="74" rx="4" fill="#2a0a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="204" y="360" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">LAYER 2</text>
  <text x="204" y="374" text-anchor="middle" fill="#fca5a5" font-size="8.5">PII</text>
  <text x="204" y="387" text-anchor="middle" fill="#9ca3af" font-size="7.5">US phone numbers</text>
  <text x="204" y="398" text-anchor="middle" fill="#9ca3af" font-size="7.5">SSN · credit cards</text>
  <text x="204" y="409" text-anchor="middle" fill="#9ca3af" font-size="7.5">IP addresses</text>

  <!-- Layer 3 -->
  <rect x="262" y="342" width="96" height="74" rx="4" fill="#2a0a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="310" y="360" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">LAYER 3</text>
  <text x="310" y="374" text-anchor="middle" fill="#fca5a5" font-size="8.5">System Paths</text>
  <text x="310" y="387" text-anchor="middle" fill="#9ca3af" font-size="7.5">/home/user/...</text>
  <text x="310" y="398" text-anchor="middle" fill="#9ca3af" font-size="7.5">/etc/passwd</text>
  <text x="310" y="409" text-anchor="middle" fill="#9ca3af" font-size="7.5">C:\Users\...</text>

  <!-- Layer 4 -->
  <rect x="368" y="342" width="96" height="74" rx="4" fill="#2a0a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="416" y="360" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">LAYER 4</text>
  <text x="416" y="374" text-anchor="middle" fill="#fca5a5" font-size="8.5">DB Queries</text>
  <text x="416" y="387" text-anchor="middle" fill="#9ca3af" font-size="7.5">password='...'</text>
  <text x="416" y="398" text-anchor="middle" fill="#9ca3af" font-size="7.5">connection strings</text>
  <text x="416" y="409" text-anchor="middle" fill="#9ca3af" font-size="7.5">pg://user:pass@...</text>

  <!-- Layer 5 -->
  <rect x="474" y="342" width="96" height="74" rx="4" fill="#2a0a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="522" y="360" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">LAYER 5</text>
  <text x="522" y="374" text-anchor="middle" fill="#fca5a5" font-size="8.5">Stack Traces</text>
  <text x="522" y="387" text-anchor="middle" fill="#9ca3af" font-size="7.5">Python tracebacks</text>
  <text x="522" y="398" text-anchor="middle" fill="#9ca3af" font-size="7.5">internal file refs</text>
  <text x="522" y="409" text-anchor="middle" fill="#9ca3af" font-size="7.5">line numbers</text>

  <!-- Layer 6 -->
  <rect x="580" y="342" width="96" height="74" rx="4" fill="#2a0a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="628" y="360" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700">LAYER 6</text>
  <text x="628" y="374" text-anchor="middle" fill="#fca5a5" font-size="8.5">Harm / Jailbreak</text>
  <text x="628" y="387" text-anchor="middle" fill="#9ca3af" font-size="7.5">"I am now DAN"</text>
  <text x="628" y="398" text-anchor="middle" fill="#9ca3af" font-size="7.5">harmful instructions</text>
  <text x="628" y="409" text-anchor="middle" fill="#9ca3af" font-size="7.5">→ BLOCK entirely</text>

  <!-- Actions row -->
  <rect x="50" y="426" width="626" height="22" rx="3" fill="#1a0505" stroke="#7f1d1d" stroke-width="0.5"/>
  <text x="363" y="441" text-anchor="middle" fill="#9ca3af" font-size="8.5">Actions: REDACT → [REDACTED]   ·   MASK → sk-***abc   ·   REMOVE → strip   ·   BLOCK → [RESPONSE BLOCKED]   ·   strict_mode=true in production</text>

  <!-- Allowlist note -->
  <rect x="50" y="456" width="626" height="22" rx="3" fill="#0f1a0f" stroke="#166534" stroke-width="0.5"/>
  <text x="363" y="471" text-anchor="middle" fill="#6ee7b7" font-size="8.5">Allowlist: S3 presigned URLs · CloudFront signed · Azure SAS · GCS signed — extracted before scan, restored after</text>

  <!-- ═══════════════════════════════════ FLOW ARROWS ════════════════ -->

  <!-- Storage → Runtime Context -->
  <line x1="230" y1="180" x2="268" y2="180" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="249" y="173" text-anchor="middle" fill="#818cf8" font-size="8">decrypt</text>
  <text x="249" y="184" text-anchor="middle" fill="#818cf8" font-size="8">on demand</text>

  <!-- Runtime Context → PII Redactor -->
  <line x1="490" y1="180" x2="528" y2="180" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="509" y="173" text-anchor="middle" fill="#34d399" font-size="8">tool</text>
  <text x="509" y="184" text-anchor="middle" fill="#34d399" font-size="8">results</text>

  <!-- PII Redactor → LLM -->
  <rect x="790" y="108" width="110" height="48" rx="6" fill="#1e1e1e" stroke="#555"/>
  <text x="845" y="130" text-anchor="middle" fill="#d1d5db" font-size="11" font-weight="600">LLM</text>
  <text x="845" y="148" text-anchor="middle" fill="#6b7280" font-size="9">Claude / GPT etc.</text>
  <line x1="750" y1="160" x2="788" y2="135" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="157" fill="#fbbf24" font-size="8">tokenized</text>

  <!-- LLM → Output Sanitizer -->
  <rect x="790" y="290" width="110" height="48" rx="6" fill="#1e1e1e" stroke="#ef4444"/>
  <text x="845" y="313" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">Output</text>
  <text x="845" y="329" text-anchor="middle" fill="#f87171" font-size="9">Sanitizer</text>
  <line x1="845" y1="156" x2="845" y2="288" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowRed)"/>
  <text x="855" y="225" fill="#ef4444" font-size="8">LLM</text>
  <text x="855" y="237" fill="#ef4444" font-size="8">response</text>

  <!-- Output Sanitizer → user -->
  <line x1="845" y1="338" x2="845" y2="405" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="790" y="406" width="110" height="38" rx="6" fill="#1e1e1e" stroke="#374151"/>
  <text x="845" y="430" text-anchor="middle" fill="#9ca3af" font-size="11">User</text>

  <!-- Output Sanitizer connects to the layer boxes -->
  <line x1="790" y1="314" x2="742" y2="314" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- Mass Assignment Shield box -->
  <rect x="790" y="196" width="110" height="78" rx="6" fill="#1a1a2e" stroke="#6366f1" stroke-width="1"/>
  <text x="845" y="217" text-anchor="middle" fill="#818cf8" font-size="9" font-weight="700">MASS ASSIGNMENT</text>
  <text x="845" y="230" text-anchor="middle" fill="#818cf8" font-size="9" font-weight="700">SHIELD</text>
  <text x="845" y="247" text-anchor="middle" fill="#6366f1" font-size="8">_PROTECTED_FIELDS</text>
  <text x="845" y="260" text-anchor="middle" fill="#6366f1" font-size="8">tenant_id · role</text>
  <text x="845" y="273" text-anchor="middle" fill="#6366f1" font-size="8">api_key · token...</text>

  <!-- Legend -->
  <rect x="30" y="510" width="730" height="36" rx="4" fill="#111" stroke="#222"/>
  <circle cx="60" cy="528" r="5" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <text x="72" y="532" fill="#6366f1" font-size="9">Fernet AES-128-CBC+HMAC-SHA256 · key rotation via MultiFernet</text>
  <circle cx="370" cy="528" r="5" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="382" y="532" fill="#10b981" font-size="9">Runtime context: credentials never leave the CredentialResolver</text>
  <circle cx="640" cy="528" r="5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="652" y="532" fill="#ef4444" font-size="9">6-layer output firewall blocks secrets at egress</text>
</svg>
