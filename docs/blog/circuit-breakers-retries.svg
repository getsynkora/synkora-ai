<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Synkora AI reliability architecture</title>
  <desc id="desc">A branded systems diagram showing request ingress, agent runtime, provider and model circuit breakers, bounded retries, repeated tool error containment, and fallback behavior.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081311"/>
      <stop offset="52%" stop-color="#0f1f1b"/>
      <stop offset="100%" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121b1a"/>
      <stop offset="100%" stop-color="#0d1416"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182423"/>
      <stop offset="100%" stop-color="#11191c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79dfbc"/>
      <stop offset="100%" stop-color="#41b98d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffce8e"/>
      <stop offset="100%" stop-color="#ff9f5a"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb7c9"/>
      <stop offset="100%" stop-color="#ff7ea1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .eyebrow { fill: #8fbfae; font: 700 16px 'Avenir Next', 'Segoe UI', Arial, sans-serif; letter-spacing: 4px; text-transform: uppercase; }
      .title { fill: #f5f7f6; font: 700 48px 'Avenir Next', 'Segoe UI', Arial, sans-serif; letter-spacing: -1.6px; }
      .subtitle { fill: #aab8b4; font: 400 19px 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
      .section { fill: #8ea59e; font: 700 14px 'Avenir Next', 'Segoe UI', Arial, sans-serif; letter-spacing: 2.8px; text-transform: uppercase; }
      .card-title { fill: #f3f6f4; font: 700 24px 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
      .body { fill: #c5d0cc; font: 400 16px 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
      .small { fill: #91a39d; font: 600 12px 'Avenir Next', 'Segoe UI', Arial, sans-serif; letter-spacing: 1.2px; text-transform: uppercase; }
      .metric { fill: #ffffff; font: 700 16px 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
      .pill { fill: #09110f; stroke: #29433b; stroke-width: 1; }
      .border { stroke: #27423d; stroke-width: 1.2; }
      .flow-base { fill: none; stroke: #223833; stroke-width: 5; stroke-linecap: round; }
      .flow-signal { fill: none; stroke: url(#accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 14 10; }
      .flow-warn { fill: none; stroke: url(#amber); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 12 10; }
      .flow-stop { fill: none; stroke: url(#rose); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 12 10; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1305" cy="165" r="170" fill="#79dfbc" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="1180" cy="715" r="150" fill="#ffb7c9" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="310" cy="145" r="120" fill="#ffce8e" fill-opacity="0.06" filter="url(#glow)"/>

  <rect x="44" y="44" width="1512" height="812" rx="26" fill="url(#panel)" stroke="#28433b" stroke-width="1.5"/>
  <rect x="76" y="76" width="1448" height="748" rx="22" fill="#0d1417" fill-opacity="0.38" stroke="#1b2e2c" stroke-width="1"/>

  <text x="120" y="135" class="eyebrow">Synkora AI Reliability Architecture</text>
  <text x="120" y="205" class="title">Circuit Breakers + Retries In The Agent Runtime</text>
  <text x="120" y="247" class="subtitle">
    <tspan x="120" dy="0">How Synkora contains provider failures, retries transient work,</tspan>
    <tspan x="120" dy="28">and stops repeated tool misuse before it spreads.</tspan>
  </text>

  <g transform="translate(120 312)" filter="url(#shadow)">
    <rect width="290" height="190" rx="18" fill="url(#card)" class="border"/>
    <text x="28" y="38" class="section">Ingress</text>
    <text x="28" y="82" class="card-title">User Request</text>
    <text x="28" y="118" class="body">
      <tspan x="28" dy="0">Request enters with tenant context,</tspan>
      <tspan x="28" dy="22">model choice, and streaming intent.</tspan>
    </text>
    <rect x="28" y="148" width="120" height="24" rx="12" class="pill"/>
    <text x="48" y="164" class="small" fill="#79dfbc">live traffic</text>
    <circle cx="238" cy="164" r="8" fill="#79dfbc">
      <animate attributeName="r" values="7;10;7" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(450 260)" filter="url(#shadow)">
    <rect width="470" height="372" rx="22" fill="url(#card)" class="border"/>
    <rect x="0" y="0" width="470" height="70" rx="22" fill="#0f1718"/>
    <rect x="24" y="22" width="150" height="28" rx="14" fill="url(#accent)" fill-opacity="0.18" stroke="#3a765f" stroke-width="1"/>
    <text x="44" y="41" class="small" fill="#79dfbc">Core Runtime</text>
    <text x="24" y="112" class="card-title">Agent Execution Engine</text>
    <text x="24" y="146" class="body">
      <tspan x="24" dy="0">Traffic is routed through model-scoped</tspan>
      <tspan x="24" dy="22">containment before failure loops start.</tspan>
    </text>

    <rect x="24" y="178" width="422" height="72" rx="16" fill="#0f1718" stroke="#27423d" stroke-width="1"/>
    <text x="44" y="205" class="small" fill="#79dfbc">LLM Layer</text>
    <text x="44" y="232" class="metric">Provider + model circuit breaker</text>
    <circle cx="394" cy="214" r="9" fill="#79dfbc">
      <animate attributeName="fill-opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/>
    </circle>

    <rect x="24" y="266" width="422" height="72" rx="16" fill="#0f1718" stroke="#27423d" stroke-width="1"/>
    <text x="44" y="293" class="small" fill="#ffce8e">Tool Layer</text>
    <text x="44" y="320" class="metric">Bounded retries with backoff</text>
    <rect x="328" y="286" width="84" height="26" rx="13" fill="#2a2117" stroke="#644a21" stroke-width="1"/>
    <text x="350" y="304" class="small" fill="#ffce8e">1s → 2s</text>

    <rect x="24" y="354" width="422" height="0" rx="16" fill="#0f1718"/>
    <text x="24" y="362" fill="#000000" fill-opacity="0">.</text>
  </g>

  <g transform="translate(450 648)" filter="url(#shadow)">
    <rect width="470" height="154" rx="22" fill="url(#card)" class="border"/>
    <text x="24" y="38" class="section">Loop Guard</text>
    <text x="24" y="78" class="card-title">Repeated Tool Error Guard</text>
    <text x="24" y="110" class="body">
      <tspan x="24" dy="0">If the same tool and deterministic error</tspan>
      <tspan x="24" dy="22">repeat, the loop stops instead of</tspan>
      <tspan x="24" dy="22">burning tokens forever.</tspan>
    </text>
    <rect x="326" y="28" width="118" height="30" rx="15" fill="url(#rose)" fill-opacity="0.16" stroke="#92566a" stroke-width="1"/>
    <text x="350" y="48" class="small" fill="#ffb7c9">3 strikes</text>
  </g>

  <g transform="translate(956 232)" filter="url(#shadow)">
    <rect width="464" height="238" rx="22" fill="url(#card)" class="border"/>
    <text x="26" y="40" class="section">Containment State</text>
    <text x="26" y="82" class="card-title">Circuit State Machine</text>
    <text x="26" y="116" class="body">
      <tspan x="26" dy="0">Reject hot failures quickly, probe</tspan>
      <tspan x="26" dy="22">safely in half-open mode, then</tspan>
      <tspan x="26" dy="22">restore flow after recovery.</tspan>
    </text>

    <rect x="28" y="150" width="108" height="44" rx="14" fill="#10221d" stroke="#2f5f4f" stroke-width="1.2"/>
    <text x="58" y="178" class="small" fill="#79dfbc">Closed</text>
    <rect x="178" y="150" width="108" height="44" rx="14" fill="#241716" stroke="#734a43" stroke-width="1.2"/>
    <text x="218" y="178" class="small" fill="#ff8f83">Open</text>
    <rect x="328" y="150" width="108" height="44" rx="14" fill="#241f17" stroke="#78603e" stroke-width="1.2"/>
    <text x="344" y="178" class="small" fill="#ffce8e">Half-open</text>

    <path d="M136 172H178" class="flow-base"/>
    <path d="M286 172H328" class="flow-base"/>
    <path d="M136 172H178" class="flow-stop">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M286 172H328" class="flow-warn">
      <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3.2s" repeatCount="indefinite"/>
    </path>

    <rect x="28" y="206" width="408" height="12" rx="6" fill="#0b1110" stroke="#233834" stroke-width="1"/>
    <rect x="28" y="206" width="262" height="12" rx="6" fill="url(#accent)">
      <animate attributeName="width" values="246;282;246" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(956 506)" filter="url(#shadow)">
    <rect width="464" height="278" rx="22" fill="url(#card)" class="border"/>
    <text x="26" y="40" class="section">Retry Discipline</text>
    <text x="26" y="82" class="card-title">Transient Errors Get A Small Window</text>
    <text x="26" y="116" class="body">
      <tspan x="26" dy="0">Retries stay narrow and cheap. Permanent</tspan>
      <tspan x="26" dy="22">mistakes are classified early and stopped.</tspan>
    </text>

    <line x1="44" y1="214" x2="418" y2="214" stroke="#28443d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="84" cy="214" r="11" fill="#79dfbc"/>
    <circle cx="204" cy="214" r="11" fill="#ffce8e"/>
    <circle cx="324" cy="214" r="11" fill="#ffce8e"/>
    <circle cx="404" cy="214" r="11" fill="#ff7ea1"/>

    <text x="54" y="250" class="small" fill="#79dfbc">attempt 1</text>
    <text x="166" y="250" class="small" fill="#ffce8e">retry 1 • 1s</text>
    <text x="286" y="250" class="small" fill="#ffce8e">retry 2 • 2s</text>
    <text x="384" y="250" class="small" fill="#ffb7c9">stop</text>

    <path d="M84 214C126 166 166 166 204 214" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M204 214C246 166 286 166 324 214" fill="none" stroke="url(#amber)" stroke-width="3"/>
    <path d="M324 214C348 188 372 184 404 214" fill="none" stroke="url(#rose)" stroke-width="3"/>

    <rect x="28" y="142" width="176" height="32" rx="16" fill="#10221d" stroke="#2f5f4f" stroke-width="1"/>
    <text x="48" y="163" class="small" fill="#79dfbc">retry transient</text>
    <rect x="222" y="142" width="214" height="32" rx="16" fill="#241716" stroke="#734a43" stroke-width="1"/>
    <text x="244" y="163" class="small" fill="#ffb7c9">never retry deterministic 4xx</text>
  </g>

  <g transform="translate(120 556)" filter="url(#shadow)">
    <rect width="290" height="178" rx="18" fill="url(#card)" class="border"/>
    <text x="28" y="40" class="section">Outcome</text>
    <text x="28" y="82" class="card-title">Fallback Or Fail Fast</text>
    <text x="28" y="118" class="body">
      <tspan x="28" dy="0">Fallback is allowed only before first</tspan>
      <tspan x="28" dy="22">token. After streaming starts, fail</tspan>
      <tspan x="28" dy="22">explicitly.</tspan>
    </text>
    <rect x="28" y="142" width="130" height="24" rx="12" class="pill"/>
    <text x="48" y="158" class="small" fill="#79dfbc">before first token</text>
  </g>

  <path d="M410 401H450" class="flow-base"/>
  <path d="M410 401H450" class="flow-signal">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <path d="M900 446H956" class="flow-base"/>
  <path d="M900 446H956" class="flow-signal">
    <animate attributeName="stroke-dashoffset" from="0" to="-42" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <path d="M900 580H956" class="flow-base"/>
  <path d="M900 580H956" class="flow-warn">
    <animate attributeName="stroke-dashoffset" from="0" to="-42" dur="2.9s" repeatCount="indefinite"/>
  </path>

  <path d="M450 726H410V645" class="flow-base"/>
  <path d="M450 726H410V645" class="flow-stop">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3.1s" repeatCount="indefinite"/>
  </path>

  <circle cx="450" cy="401" r="7" fill="#79dfbc">
    <animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="956" cy="446" r="7" fill="#79dfbc">
    <animate attributeName="r" values="6;9;6" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="956" cy="580" r="7" fill="#ffce8e">
    <animate attributeName="r" values="6;9;6" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="410" cy="645" r="7" fill="#ff7ea1">
    <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="120" y="806" class="small" fill="#6f8b84">Built for the Synkora AI engineering journal</text>
  <text x="1115" y="806" class="small" fill="#79dfbc">retries recover • circuit breakers contain</text>
</svg>
