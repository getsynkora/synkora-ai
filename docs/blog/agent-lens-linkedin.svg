<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e0d"/>
      <stop offset="60%" stop-color="#081419"/>
      <stop offset="100%" stop-color="#060c12"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79dfbc"/>
      <stop offset="100%" stop-color="#41b98d"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff7e2f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="100%" stop-color="#4fa8d5"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4a7f7"/>
      <stop offset="100%" stop-color="#9b72ef"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7ea1"/>
      <stop offset="100%" stop-color="#e84d7a"/>
    </linearGradient>
    <linearGradient id="card-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1e1c"/>
      <stop offset="100%" stop-color="#091418"/>
    </linearGradient>
    <linearGradient id="card-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#060d18"/>
    </linearGradient>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <style>
      .f-mono { font-family: 'Courier New', 'Menlo', monospace; }
      .f-sans { font-family: 'Avenir Next', 'Segoe UI', 'Inter', Arial, sans-serif; }
    </style>
  </defs>

  <!-- BG -->
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="300" rx="300" ry="200" fill="#41b98d" fill-opacity="0.045"/>
  <ellipse cx="1050" cy="320" rx="260" ry="180" fill="#4fa8d5" fill-opacity="0.05"/>
  <ellipse cx="600" cy="80" rx="200" ry="100" fill="#9b72ef" fill-opacity="0.04"/>

  <!-- Outer border -->
  <rect x="24" y="24" width="1152" height="579" rx="20" fill="none" stroke="#1c3a34" stroke-width="1.2"/>

  <!-- ── LEFT SIDE: THE RECEIPT ── -->
  <g filter="url(#shadow)">
    <rect x="56" y="60" width="470" height="510" rx="18" fill="url(#card-left)" stroke="#1e3c36" stroke-width="1.2"/>
  </g>

  <!-- Left header -->
  <rect x="56" y="60" width="470" height="58" rx="18" fill="#0e201e"/>
  <rect x="56" y="96" width="470" height="22" fill="#0e201e"/>
  <text x="88" y="96" class="f-sans" fill="#4a7a6e" font-size="11" font-weight="700" letter-spacing="3">STANDARD LLM OBSERVABILITY</text>
  <line x1="56" y1="118" x2="526" y2="118" stroke="#1c3a34" stroke-width="1"/>

  <!-- Receipt label -->
  <rect x="80" y="134" width="96" height="24" rx="12" fill="#1a3028" stroke="#2a5040" stroke-width="1"/>
  <text x="128" y="151" text-anchor="middle" class="f-sans" fill="#4faa82" font-size="11" font-weight="700" letter-spacing="1.5">RECEIPT</text>

  <!-- Big grey stat — what you see -->
  <text x="291" y="220" text-anchor="middle" class="f-sans" fill="#1e3830" font-size="90" font-weight="800">$0.003</text>
  <text x="291" y="260" text-anchor="middle" class="f-sans" fill="#1e3830" font-size="40" font-weight="700">14,200 tokens</text>
  <text x="291" y="300" text-anchor="middle" class="f-sans" fill="#172c24" font-size="28" font-weight="600">1.8 seconds</text>

  <!-- What it doesn't tell you -->
  <line x1="80" y1="328" x2="502" y2="328" stroke="#182c26" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="291" y="358" text-anchor="middle" class="f-sans" fill="#2e5a4e" font-size="13" font-weight="600" letter-spacing="2">WHAT IT DOESN'T SHOW YOU</text>

  <rect x="80" y="374" width="422" height="40" rx="10" fill="#0c1a16" stroke="#1a3028" stroke-width="1"/>
  <text x="108" y="399" class="f-sans" fill="#2e5044" font-size="15">✗  The tool failed and retried twice</text>

  <rect x="80" y="422" width="422" height="40" rx="10" fill="#0c1a16" stroke="#1a3028" stroke-width="1"/>
  <text x="108" y="447" class="f-sans" fill="#2e5044" font-size="15">✗  Context pruning truncated SQL results</text>

  <rect x="80" y="470" width="422" height="40" rx="10" fill="#0c1a16" stroke="#1a3028" stroke-width="1"/>
  <text x="108" y="495" class="f-sans" fill="#2e5044" font-size="15">✗  Model reasoned from 40% of the data</text>

  <rect x="80" y="518" width="422" height="36" rx="10" fill="#0c1a16" stroke="#1a3028" stroke-width="1"/>
  <text x="108" y="541" class="f-sans" fill="#2e5044" font-size="15">✗  No error thrown. No alert fired.</text>

  <!-- ── DIVIDER ARROW ── -->
  <line x1="600" y1="100" x2="600" y2="527" stroke="#1a3430" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="600" y="64" text-anchor="middle" class="f-sans" fill="#1c3c32" font-size="11" font-weight="700" letter-spacing="2">VS</text>

  <!-- Arrow pointing right -->
  <path d="M574 314 L626 314" stroke="#41b98d" stroke-width="2" stroke-opacity="0.4"/>
  <polygon points="626,314 616,309 616,319" fill="#41b98d" fill-opacity="0.4"/>

  <!-- ── RIGHT SIDE: THE SEQUENCE ── -->
  <g filter="url(#shadow)">
    <rect x="674" y="60" width="500" height="510" rx="18" fill="url(#card-right)" stroke="#1e3a54" stroke-width="1.2"/>
  </g>

  <!-- Right header -->
  <rect x="674" y="60" width="500" height="58" rx="18" fill="#091424"/>
  <rect x="674" y="96" width="500" height="22" fill="#091424"/>
  <text x="706" y="96" class="f-sans" fill="#3a7090" font-size="11" font-weight="700" letter-spacing="3">AGENT LENS · EVENT SEQUENCE</text>
  <line x1="674" y1="118" x2="1174" y2="118" stroke="#162840" stroke-width="1"/>

  <!-- Sequence label -->
  <rect x="698" y="134" width="114" height="24" rx="12" fill="#0f2040" stroke="#1e4060" stroke-width="1"/>
  <text x="755" y="151" text-anchor="middle" class="f-sans" fill="#4fa8d5" font-size="11" font-weight="700" letter-spacing="1.5">TRUTH</text>

  <!-- Timeline rows -->
  <!-- seq 1 -->
  <rect x="698" y="170" width="450" height="44" rx="10" fill="#081422" stroke="#142038" stroke-width="1"/>
  <rect x="698" y="170" width="4" height="44" rx="2" fill="url(#green)"/>
  <text x="718" y="187" class="f-mono" fill="#6fada0" font-size="10" font-weight="700">seq=1</text>
  <text x="770" y="187" class="f-mono" fill="#79dfbc" font-size="13" font-weight="600">user_message</text>
  <text x="718" y="204" class="f-sans" fill="#3a6a60" font-size="12">"pull last quarter sales by region"</text>

  <!-- seq 2 -->
  <rect x="698" y="222" width="450" height="44" rx="10" fill="#081422" stroke="#142038" stroke-width="1"/>
  <rect x="698" y="222" width="4" height="44" rx="2" fill="url(#orange)"/>
  <text x="718" y="239" class="f-mono" fill="#6fada0" font-size="10" font-weight="700">seq=2</text>
  <text x="770" y="239" class="f-mono" fill="#ffb347" font-size="13" font-weight="600">llm_call</text>
  <text x="718" y="256" class="f-sans" fill="#3a6a60" font-size="12">gpt-4o · 1,840 tokens · 312ms · ctx=14%</text>

  <!-- seq 3 -->
  <rect x="698" y="274" width="450" height="44" rx="10" fill="#081422" stroke="#142038" stroke-width="1"/>
  <rect x="698" y="274" width="4" height="44" rx="2" fill="url(#blue)"/>
  <text x="718" y="291" class="f-mono" fill="#6fada0" font-size="10" font-weight="700">seq=5</text>
  <text x="770" y="291" class="f-mono" fill="#7ec8e3" font-size="13" font-weight="600">tool_call</text>
  <text x="718" y="308" class="f-sans" fill="#3a6a60" font-size="12">execute_query · 1,203ms · success=false · retries=1</text>

  <!-- seq 4 — PRUNING — highlighted -->
  <rect x="698" y="326" width="450" height="52" rx="10" fill="#0e1828" stroke="#c4a7f7" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="698" y="326" width="4" height="52" rx="2" fill="url(#violet)"/>
  <text x="718" y="345" class="f-mono" fill="#6fada0" font-size="10" font-weight="700">seq=8</text>
  <text x="770" y="345" class="f-mono" fill="#c4a7f7" font-size="13" font-weight="700">tool_pruning</text>
  <rect x="960" y="330" width="78" height="18" rx="9" fill="#3a1a60" stroke="#6a3aaa" stroke-width="1"/>
  <text x="999" y="343" text-anchor="middle" class="f-sans" fill="#c4a7f7" font-size="10" font-weight="700">⚠ DATA LOST</text>
  <text x="718" y="366" class="f-sans" fill="#7a60a0" font-size="12">turn=7 · pruned=3 · data_bearing=1 · saved=4,200 tokens</text>

  <!-- seq 5 -->
  <rect x="698" y="386" width="450" height="44" rx="10" fill="#081422" stroke="#142038" stroke-width="1"/>
  <rect x="698" y="386" width="4" height="44" rx="2" fill="url(#orange)"/>
  <text x="718" y="403" class="f-mono" fill="#6fada0" font-size="10" font-weight="700">seq=9</text>
  <text x="770" y="403" class="f-mono" fill="#ffb347" font-size="13" font-weight="600">llm_call</text>
  <text x="718" y="420" class="f-sans" fill="#3a6a60" font-size="12">gpt-4o · 3,880 tokens · 398ms · ctx=29%  ← context dropped</text>

  <!-- seq 6 -->
  <rect x="698" y="438" width="450" height="44" rx="10" fill="#081422" stroke="#142038" stroke-width="1"/>
  <rect x="698" y="438" width="4" height="44" rx="2" fill="url(#green)"/>
  <text x="718" y="455" class="f-mono" fill="#6fada0" font-size="10" font-weight="700">seq=12</text>
  <text x="780" y="455" class="f-mono" fill="#79dfbc" font-size="13" font-weight="600">assistant_message</text>
  <text x="718" y="472" class="f-sans" fill="#3a6a60" font-size="12">total: 19,200 tokens · $0.0038 · 2,580ms</text>

  <!-- "This is why it was wrong" annotation -->
  <line x1="960" y1="377" x2="960" y2="395" stroke="#c4a7f7" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Insight callout -->
  <rect x="698" y="492" width="450" height="62" rx="12" fill="#0c1830" stroke="#1e3a54" stroke-width="1"/>
  <text x="724" y="514" class="f-sans" fill="#4fa8d5" font-size="12" font-weight="700">seq=8 is why the answer was wrong.</text>
  <text x="724" y="532" class="f-sans" fill="#3a6a60" font-size="12">Context pruned the SQL result on turn 7.</text>
  <text x="724" y="548" class="f-sans" fill="#3a6a60" font-size="12">The model never knew the data was gone.</text>

  <!-- ── BOTTOM BAR ── -->
  <rect x="56" y="586" width="1088" height="30" rx="10" fill="#060e0c" stroke="#12241e" stroke-width="1"/>

  <!-- Synkora wordmark -->
  <text x="88" y="606" class="f-sans" fill="#2a5a4a" font-size="12" font-weight="700" letter-spacing="1">SYNKORA</text>
  <text x="156" y="606" class="f-sans" fill="#152820" font-size="12">·</text>

  <!-- Stats row -->
  <text x="172" y="606" class="f-sans" fill="#1e4038" font-size="11">~1µs write overhead</text>
  <text x="296" y="606" class="f-sans" fill="#0e2018" font-size="11">·</text>
  <text x="310" y="606" class="f-sans" fill="#1e4038" font-size="11">5 event types</text>
  <text x="416" y="606" class="f-sans" fill="#0e2018" font-size="11">·</text>
  <text x="430" y="606" class="f-sans" fill="#1e4038" font-size="11">312 silent data losses found in week 1</text>
  <text x="680" y="606" class="f-sans" fill="#0e2018" font-size="11">·</text>
  <text x="694" y="606" class="f-sans" fill="#1e4038" font-size="11">cache hit rate: 4% → 67%</text>

  <!-- Right tagline -->
  <text x="1040" y="606" class="f-sans" fill="#2a6a56" font-size="11" font-weight="600" letter-spacing="1">the sequence is the truth</text>

  <!-- ── TOP HEADLINE ── (full width, above cards) -->
  <!-- removed — cards tell the story -->

  <!-- Connector dots between left "X" items and the pruning row -->
  <circle cx="646" cy="352" r="3" fill="#c4a7f7" fill-opacity="0.3"/>

</svg>
