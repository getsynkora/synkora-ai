name: synkora_chat
description: Native Flutter SDK for embedding Synkora AI chat widgets. Drop-in UI + headless API client with local message cache.
version: 1.13.3
homepage: https://synkora.com
repository: https://github.com/synkora/synkora-flutter
issue_tracker: https://github.com/synkora/synkora-flutter/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  flutter_markdown: ^0.7.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  mocktail: ^1.0.4

flutter:
  assets:
    - lib/src/assets/animations/choose_your_colors.json
