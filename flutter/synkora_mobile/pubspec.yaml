name: synkora_mobile
description: Dedicated Flutter app for signed-in Synkora users to access all tenant agents.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  file_picker: ^10.3.2
  flutter_secure_storage: ^9.2.2
  flutter_markdown: ^0.7.7+1
  flutter_svg: ^2.1.0
  google_fonts: ^6.2.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  lottie: ^3.1.0
  synkora_chat:
    path: ../synkora_chat
  url_launcher: ^6.3.2
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

dependency_overrides:
  speech_to_text:
    path: vendor/speech_to_text

flutter:
  uses-material-design: true
  assets:
    - assets/art/
